name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar produção Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GAS_ENDPOINT_URL: ${{ secrets.GAS_ENDPOINT_URL }}
      GAS_SHARED_TOKEN: ${{ secrets.GAS_SHARED_TOKEN }}
      GAS_LEADS_ADMIN_TOKEN: ${{ secrets.GAS_LEADS_ADMIN_TOKEN }}
      CATALOGO_PUBLIC_URL: ${{ secrets.CATALOGO_PUBLIC_URL }}
    steps:
      - name: Baixar código de produção
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validar credenciais de publicação
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Instalar dependências
        run: npm ci
      - name: Auditoria de dependências
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Testar e compilar
        run: |
          npm test
          npm run build
      - name: Sincronizar segredo Supabase no Worker
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        shell: bash
        run: printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
      - name: Informar ausência do segredo Supabase
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: echo "SUPABASE_SERVICE_ROLE_KEY não está cadastrada nos Secrets do GitHub; escritas administrativas Supabase que dependem de service role continuarão indisponíveis."
      - name: Publicar no Cloudflare
        run: npx wrangler deploy
