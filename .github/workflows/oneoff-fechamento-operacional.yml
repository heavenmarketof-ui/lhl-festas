name: Fechamento operacional em lote
on:
  push:
    branches: [home-nova]
    paths: ['.github/workflows/oneoff-fechamento-operacional.yml']
permissions:
  contents: write
jobs:
  fechar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: home-nova }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Corrigir produção e contrato
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/routes/admin.index.tsx')
          s=p.read_text()
          pattern=r'(?P<i>\s*)const \{ updateItemProducaoStatus \} = await import\("@/lib/producao-api"\);\s*const opFinal = await updateItemProducaoStatus\(item\.opId, item\.itemId, "Concluído"\);'
          def repl(m):
            i=m.group('i')
            return f'{i}const opAtual = ordensProducao.find((x) => x.id === item.opId);\n{i}if (!opAtual) throw new Error("Ordem de produção não encontrada.");\n{i}const {{ atualizarStatusProducaoSeguro }} = await import("@/lib/producao-operacional-safe");\n{i}const opFinal = await atualizarStatusProducaoSeguro(opAtual, item.itemId, "Concluído");'
          s,n=re.subn(pattern,repl,s,count=1)
          assert n == 1, f'esperava 1 chamada direta, encontrei {n}'
          p.write_text(s)

          c=Path('src/routes/contract.$id.tsx')
          s=c.read_text()
          if 'noindex, nofollow' not in s:
            s=s.replace('meta: [{ title: "Contrato — LHL Festas" }],','meta: [{ title: "Contrato — LHL Festas" }, { name: "robots", content: "noindex, nofollow" }],')
          assert 'noindex, nofollow' in s
          c.write_text(s)

          offenders=[]
          for f in Path('src').rglob('*.ts*'):
            if f.name in {'producao-api.ts','producao-operacional-safe.ts'}: continue
            t=f.read_text(errors='ignore')
            if 'updateItemProducaoStatus' in t or 'confirmarKitPronto(' in t:
              offenders.append(str(f))
          if offenders: raise SystemExit('Chamadas sem porta segura: '+', '.join(offenders))
          PY
          npm audit --omit=dev --audit-level=high
          npm test
          npm run build
      - name: Commitar fechamento
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin.index.tsx 'src/routes/contract.$id.tsx'
          git commit -m 'Fecha trava financeira da produção e privacidade do contrato'
          git push origin HEAD:home-nova
