name: Fechamento operacional em lote
on:
  push:
    branches: [home-nova]
    paths: ['.github/workflows/oneoff-fechamento-operacional.yml']
permissions:
  contents: write
jobs:
  fechar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: home-nova }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Corrigir porta segura e reforçar contrato
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/routes/admin.index.tsx')
          s=p.read_text()
          old='''                  const { updateItemProducaoStatus } = await import("@/lib/producao-api");
                  const opFinal = await updateItemProducaoStatus(item.opId, item.itemId, "Concluído");'''
          new='''                  const opAtual = ordensProducao.find((x) => x.id === item.opId);
                  if (!opAtual) throw new Error("Ordem de produção não encontrada.");
                  const { atualizarStatusProducaoSeguro } = await import("@/lib/producao-operacional-safe");
                  const opFinal = await atualizarStatusProducaoSeguro(opAtual, item.itemId, "Concluído");'''
          assert old in s, 'chamada direta esperada não encontrada'
          p.write_text(s.replace(old,new))

          c=Path('src/routes/contract.$id.tsx')
          s=c.read_text()
          old='meta: [{ title: "Contrato — LHL Festas" }],'
          new='meta: [{ title: "Contrato — LHL Festas" }, { name: "robots", content: "noindex, nofollow" }],'
          if old in s: s=s.replace(old,new)
          assert 'noindex, nofollow' in s
          c.write_text(s)

          sec=Path('src/lib/response-security.ts').read_text()
          sitemap=Path('src/routes/sitemap[.]xml.ts').read_text()
          assert '"/reserva"' in sec
          assert '{ path: "/reserva"' not in sitemap

          offenders=[]
          for f in Path('src').rglob('*.ts*'):
            if f.name in {'producao-api.ts','producao-operacional-safe.ts'}: continue
            t=f.read_text(errors='ignore')
            if 'updateItemProducaoStatus' in t or 'confirmarKitPronto(' in t:
              offenders.append(str(f))
          if offenders: raise SystemExit('Chamadas sem porta segura: '+', '.join(offenders))
          PY
          npm audit --omit=dev --audit-level=high
          npm test
          npm run build
      - name: Commitar fechamento
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/admin.index.tsx 'src/routes/contract.$id.tsx'
          git commit -m 'Fecha trava financeira da produção e privacidade do contrato'
          git push origin HEAD:home-nova
