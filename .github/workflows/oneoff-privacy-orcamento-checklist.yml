name: One-off privacidade orçamento e checklist
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oneoff-privacy-orcamento-checklist.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-nova
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Aplicar correções
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/routes/orcamento.tsx')
          s = p.read_text()
          s = s.replace('const ORCAMENTO_DRAFT_KEY = "lhl_orcamento_draft";\n', '')
          old = '''async function storeLead(lead: LeadPayload): Promise<{ id: string }> {\n  // Cache local para retomada offline (não substitui backend).\n  try {\n    const key = "lhl_leads";\n    const prev = JSON.parse(localStorage.getItem(key) || "[]");\n    prev.push(lead);\n    localStorage.setItem(key, JSON.stringify(prev));\n  } catch { /* noop */ }\n\n  // Envio permanente ao backend (Google Sheets via Apps Script).'''
          new = '''async function storeLead(lead: LeadPayload): Promise<{ id: string }> {\n  // Dados pessoais seguem diretamente para o backend; não ficam persistidos no navegador.\n  // Envio permanente ao backend (Google Sheets via Apps Script).'''
          assert old in s, 'bloco localStorage não encontrado'
          s = s.replace(old, new)
          start = s.index('    // Restaurar rascunho, se existir.\n')
          end = s.index('    // Se vier descrição do catálogo', start)
          s = s[:start] + s[end:]
          start = s.index('  function saveDraft() {\n')
          end = s.index('  function abrirCatalogo(origem: string) {\n', start)
          s = s[:start] + s[end:]
          s = s.replace('    saveDraft();\n', '')
          s = s.replace('      sessionStorage.removeItem(ORCAMENTO_DRAFT_KEY);\n', '')
          p.write_text(s)

          p = Path('src/routes/checklist.$id.tsx')
          s = p.read_text()
          s = s.replace('import { getOrderFromSheet } from "@/lib/orders-cache";\n', 'import { fetchOrdersFromSheet } from "@/lib/sheets-api";\n')
          old = '''    getOrderFromSheet(id, { includeDeleted: true })\n      .then((o) => { if (o && String(o.status) !== "Excluído") setOrder(o); })\n      .finally(() => setLoaded(true));'''
          new = '''    fetchOrdersFromSheet({ includeDeleted: true, force: true })\n      .then((orders) => orders.find((o) => o.id === id))\n      .then((o) => { if (o && String(o.status) !== "Excluído") setOrder(o); })\n      .finally(() => setLoaded(true));'''
          assert old in s, 'busca pública do checklist não encontrada'
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verificar remoções
        run: |
          ! grep -q 'lhl_leads\|lhl_orcamento_draft\|saveDraft' src/routes/orcamento.tsx
          ! grep -q 'getOrderFromSheet' 'src/routes/checklist.$id.tsx'
          grep -q 'fetchOrdersFromSheet' 'src/routes/checklist.$id.tsx'
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/orcamento.tsx 'src/routes/checklist.$id.tsx'
          git commit -m 'Protege dados pessoais do orçamento e checklist' || exit 0
          git push origin home-nova
