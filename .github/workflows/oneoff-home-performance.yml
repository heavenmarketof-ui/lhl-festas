name: Otimizar Home
on:
  push:
    branches: [home-nova]
    paths: ['.github/workflows/oneoff-home-performance.yml']
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: home-nova }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Otimizar carregamento visual
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/index.tsx')
          s=p.read_text()
          old='const driveImage = (id: string) => `https://drive.google.com/thumbnail?id=${id}&sz=w1600`;'
          new='const driveImage = (id: string, width = 900) => `https://drive.google.com/thumbnail?id=${id}&sz=w${width}`;'
          assert old in s
          s=s.replace(old,new)
          s=s.replace('const HERO_IMAGE = driveImage("1FTVXnS_eFo_gZHo1EGhQgq1nauyGq5pc");','const HERO_IMAGE = driveImage("1FTVXnS_eFo_gZHo1EGhQgq1nauyGq5pc", 1600);')
          s=s.replace('const FESTA_NA_MESA_IMAGE = driveImage("1lPR3hKeeyibMSse1xzyK6ZfSz0zUV4ov");','const FESTA_NA_MESA_IMAGE = driveImage("1lPR3hKeeyibMSse1xzyK6ZfSz0zUV4ov", 900);')
          s=s.replace('const PERSONALIZADO_IMAGE = driveImage("12OGmQ4DEVI3ADHVu7weFGLDreXw49IIi");','const PERSONALIZADO_IMAGE = driveImage("12OGmQ4DEVI3ADHVu7weFGLDreXw49IIi", 900);')
          s=s.replace('const PEG_MONTE_IMAGE = driveImage("1d5xpnRNkiSECrh5FlkSC8DnISWWDBMh9");','const PEG_MONTE_IMAGE = driveImage("1d5xpnRNkiSECrh5FlkSC8DnISWWDBMh9", 900);')
          s=s.replace('src={logoImages[0]} alt="LHL Festas" className=', 'src={logoImages[0]} alt="LHL Festas" loading="eager" decoding="async" className=')
          s=s.replace('src={HERO_IMAGE} alt="Decoração Moranguinho da LHL Festas" className=', 'src={HERO_IMAGE} alt="Decoração Moranguinho da LHL Festas" decoding="async" className=')
          s=s.replace('src={card.image} alt={card.title} className=', 'src={card.image} alt={card.title} loading="lazy" decoding="async" className=')
          p.write_text(s)
          PY
          grep -q 'width = 900' src/routes/index.tsx
          grep -q 'loading="lazy" decoding="async"' src/routes/index.tsx
          npm test
          npm run build
      - name: Commitar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/index.tsx
          git commit -m 'Otimiza carregamento das imagens da Home'
          git push origin HEAD:home-nova
