name: One-off Gestão faturamento por entregas do período
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oneoff-gestao-faturamento.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-nova
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Corrigir semântica do faturamento
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/gestao/aggregate.ts')
          s = p.read_text()
          s = s.replace(
            '''  // FATURAMENTO = somente festas/entregas efetivamente ocorridas até hoje.\n  // Eventos futuros permanecem na carteira/a receber, mas não entram como realizado.\n  const entregues = snap.orders.filter((o) => {\n    if (cancelado(o)) return false;\n    const ev = dataEvento(o);\n    return dentroRealizado(p, fim, ev);\n  });''',
            '''  // FATURAMENTO = valor de todas as festas/entregas pertencentes ao período\n  // selecionado. No mês atual, inclui também eventos agendados para os próximos\n  // dias do próprio mês; recebimentos e saídas continuam realizados até hoje.\n  const entregues = snap.orders.filter((o) => {\n    if (cancelado(o)) return false;\n    return dentro(p, dataEvento(o));\n  });'''
          )
          s = s.replace(
            '''    const entregasLote = snap.orders.filter((o) => {\n      if (cancelado(o)) return false;\n      const ev = dataEvento(o);\n      return !!fimAtual && !!ev && ev >= b.inicio && ev <= b.fim && ev <= fimAtual;\n    });''',
            '''    const entregasLote = snap.orders.filter((o) => {\n      if (cancelado(o)) return false;\n      const ev = dataEvento(o);\n      return !!ev && ev >= b.inicio && ev <= b.fim;\n    });'''
          )
          s = s.replace(
            '''  const entreguesPeriodo = snap.orders.filter((o) => {\n    if (cancelado(o)) return false;\n    const ev = dataEvento(o);\n    return dentroRealizado(periodo, fimAtual, ev);\n  });''',
            '''  const entreguesPeriodo = snap.orders.filter((o) => {\n    if (cancelado(o)) return false;\n    return dentro(periodo, dataEvento(o));\n  });'''
          )
          p.write_text(s)
          PY
      - name: Verificar regra
        run: |
          grep -q 'return dentro(p, dataEvento(o));' src/lib/gestao/aggregate.ts
          grep -q 'return dentro(periodo, dataEvento(o));' src/lib/gestao/aggregate.ts
          ! grep -q 'ev <= fimAtual' src/lib/gestao/aggregate.ts
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/gestao/aggregate.ts
          git commit -m 'Corrige faturamento para entregas do período selecionado' || exit 0
          git push origin home-nova
