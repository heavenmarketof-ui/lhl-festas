name: Corrigir dependencias vulneraveis

on:
  workflow_dispatch:
  push:
    branches: [home-nova]
    paths:
      - '.github/workflows/oneoff-deps-seguranca.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-nova
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Atualizar somente a cadeia Nitro vulneravel
        run: |
          npm install nitro@3.0.260903-beta --save-exact
          npm audit --omit=dev --audit-level=high
          npm test
          npm run build
      - name: Commitar se tudo passou
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Sem alteracoes.'
            exit 0
          fi
          git commit -m 'Atualiza Nitro e corrige vulnerabilidade alta'
          git push origin HEAD:home-nova
