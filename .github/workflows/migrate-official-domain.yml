name: Migrar domínio oficial LHL

on:
  push:
    branches: [home-nova]
    paths:
      - .github/workflows/migrate-official-domain.yml

permissions:
  contents: write

jobs:
  migrate-domain:
    if: github.event.head_commit.message == 'Adiciona migração única para domínio oficial da LHL'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: home-nova

      - name: Substituir domínio antigo nas rotas públicas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'https://lhl-festas.lovable.app'
          new = 'https://www.lhlfestas.com.br'
          changed = []
          for path in Path('src/routes').glob('*.tsx'):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  continue
              updated = text.replace(old, new)
              path.write_text(updated, encoding='utf-8')
              changed.append(str(path))

          print('Arquivos atualizados:')
          for item in changed:
              print('-', item)
          PY

      - name: Confirmar que o domínio antigo saiu das rotas
        shell: bash
        run: |
          if grep -R "https://lhl-festas.lovable.app" src/routes --include='*.tsx'; then
            echo "Ainda existem referências antigas nas rotas."
            exit 1
          fi

      - name: Commit da migração
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes
          git commit -m "Migra rotas públicas para lhlfestas.com.br"
          git push origin home-nova
