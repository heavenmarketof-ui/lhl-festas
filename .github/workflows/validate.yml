name: Validar Sistema LHL

on:
  push:
    branches:
      - home-nova
      - import-base-segura
  pull_request:

jobs:
  build:
    name: Testes e build de produção
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Impedir retorno de links públicos do Lovable
        shell: bash
        run: |
          if grep -R "https://lhl-festas.lovable.app" src/routes src/components/consultor src/lib/consultor --include='*.ts' --include='*.tsx'; then
            echo "Foi encontrada uma referência pública direta ao site antigo do Lovable."
            exit 1
          fi

      - name: Impedir credenciais e endpoints privados fixos no código
        shell: bash
        run: |
          if grep -R -E 'AKfy[a-zA-Z0-9_-]{20,}|lhl-leads-[0-9]{4}-admin' src --include='*.ts' --include='*.tsx'; then
            echo "Foi encontrado endpoint/token legado fixo no código."
            exit 1
          fi

      - name: Auditar heranças do Lovable fora da ponte temporária do catálogo
        shell: bash
        run: |
          matches="$(grep -R -n -i 'lovable' src --include='*.ts' --include='*.tsx' || true)"
          unexpected="$(printf '%s\n' "$matches" | grep -v 'src/lib/catalogo-publico.functions.ts' || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected"
            echo "Foi encontrada dependência textual inesperada do Lovable."
            exit 1
          fi

      - name: Validar configuração do domínio oficial
        shell: bash
        run: |
          grep -q '"name": "lhl-festas"' wrangler.jsonc
          grep -q '"compatibility_flags": \["nodejs_compat"\]' wrangler.jsonc

      - name: Rodar testes de regras de negócio
        run: npm test

      - name: Compilar projeto
        run: npm run build
