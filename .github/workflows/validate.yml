name: Validar Sistema LHL

on:
  push:
    branches:
      - home-nova
      - import-base-segura
  pull_request:

jobs:
  build:
    name: Build de produção
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar projeto
        run: npm run build
